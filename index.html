<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redirecionando...</title>
    <script>
        // Dicionário de rotas: associe cada ID ao seu respectivo link de destino
        const rotas = {
            "1": "https://www.google.com",
            "2": "https://github.com",
            "3": "https://stackoverflow.com"
            // Adicione novos IDs e links aqui conforme necessário
        };

        function redirecionar() {
            const params = new URLSearchParams(window.location.search);
            const id = params.get("id");

            if (id && rotas[id]) {
                window.location.replace(rotas[id]);
            } else {
                document.getElementById("mensagem").innerText = "ID inválido ou não encontrado.";
            }
        }

        window.onload = redirecionar;
    </script>
</head>
<body>
    <p id="mensagem" style="text-align: center; margin-top: 20vh; font-family: sans-serif; font-size: 18px;">Redirecionando...</p>
</body>
</html>
